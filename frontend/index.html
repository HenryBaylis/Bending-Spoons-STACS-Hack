<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    #card {
      background: rgba(15, 15, 20, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 14px 16px;
      width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 4px;
    }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    #live-section { margin-bottom: 10px; }

    #live-text {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      font-family: monospace;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
    }

    #mention-section {
      display: none;
      margin-bottom: 10px;
      border-left: 2px solid rgba(250, 204, 21, 0.5);
      padding-left: 8px;
    }

    #mention-section.visible { display: block; }

    #mention-text {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      line-height: 1.4;
    }

    #summary-section { margin-bottom: 10px; }

    #summary-text {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      line-height: 1.4;
      font-style: italic;
    }

    #question-section {
      display: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 10px;
      animation: slideIn 0.2s ease;
    }

    #question-section.visible { display: block; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #transcript-text {
      font-size: 13px;
      color: rgba(255,255,255,0.65);
      margin-bottom: 10px;
      line-height: 1.4;
    }

    #answer-text {
      font-size: 14px;
      color: #fff;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    button {
      -webkit-app-region: no-drag;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 7px;
      color: rgba(255,255,255,0.6);
      font-size: 12px;
      padding: 5px 12px;
      cursor: pointer;
    }

    button:hover {
      background: rgba(255,255,255,0.14);
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="card">
    <div id="live-section">
      <div class="label"><span class="dot"></span>Live</div>
      <div id="live-text">—</div>
    </div>

    <div id="mention-section">
      <div class="label">Mentioned</div>
      <div id="mention-text"></div>
    </div>

    <div id="summary-section">
      <div class="label">Last summary</div>
      <div id="summary-text">—</div>
    </div>

    <div id="question-section">
      <div class="label">Someone's asking you</div>
      <div id="transcript-text"></div>
      <div class="label" style="margin-bottom:6px">Suggested response</div>
      <div id="answer-text"></div>
      <div id="follow-up-section" style="display:none; margin-top:10px; border-top:1px solid rgba(255,255,255,0.06); padding-top:8px;">
        <div class="label" style="margin-bottom:4px">Possible follow-up</div>
        <div id="follow-up-text" style="font-size:13px; color:rgba(255,255,255,0.5); line-height:1.4; font-style:italic;"></div>
      </div>
      <button class="dismiss-btn" onclick="dismiss()" style="margin-top:12px;">Dismiss</button>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron')

    // ── Setup screen logic ──
    const nameInput = document.getElementById('input-name')
    const jobInput = document.getElementById('input-job')
    const startBtn = document.getElementById('start-btn')
    const fileInput = document.getElementById('file-input')
    const fileNameDisplay = document.getElementById('file-name-display')
    const fileDrop = document.getElementById('file-drop')

    let pendingFile = null

    function updateStartBtn() {
      startBtn.disabled = !nameInput.value.trim() || !jobInput.value.trim()
    }

    nameInput.addEventListener('input', updateStartBtn)
    jobInput.addEventListener('input', updateStartBtn)

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0]
      if (!file) return
      fileNameDisplay.textContent = file.name
      const reader = new FileReader()
      if (file.type === 'application/pdf') {
        reader.readAsArrayBuffer(file)
        reader.onload = () => {
          pendingFile = { name: file.name, type: file.type, data: Array.from(new Uint8Array(reader.result)) }
        }
      } else {
        reader.readAsText(file)
        reader.onload = () => {
          pendingFile = { name: file.name, type: file.type, data: reader.result }
        }
      }
    })

    // Drag and drop on file-drop zone
    fileDrop.addEventListener('dragover', (e) => { e.preventDefault(); fileDrop.classList.add('dragover') })
    fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('dragover'))
    fileDrop.addEventListener('drop', (e) => {
      e.preventDefault()
      fileDrop.classList.remove('dragover')
      const file = e.dataTransfer.files[0]
      if (file) {
        fileInput.files = e.dataTransfer.files
        fileInput.dispatchEvent(new Event('change'))
      }
    })

    startBtn.addEventListener('click', () => {
      ipcRenderer.send('start-meeting', {
        name: nameInput.value.trim(),
        jobTitle: jobInput.value.trim(),
        contextFile: pendingFile,
      })
    })

    // ── Screen switching ──
    ipcRenderer.on('show-setup', () => {
      document.getElementById('setup-screen').classList.add('visible')
      document.getElementById('card').classList.remove('visible')
      // Reset overlay state
      document.getElementById('question-section').classList.remove('visible')
      document.getElementById('mention-section').classList.remove('visible')
      document.getElementById('live-text').textContent = '—'
      document.getElementById('summary-text').textContent = '—'
      mentionActiveUntil = 0
    })

    ipcRenderer.on('show-overlay', () => {
      document.getElementById('setup-screen').classList.remove('visible')
      document.getElementById('card').classList.add('visible')
    })

    // ── Overlay events ──
    let mentionActiveUntil = 0

    ipcRenderer.on('mention', (_, data) => {
      const card = document.getElementById('card')
      card.classList.remove('mentioned')
      void card.offsetWidth
      card.classList.add('mentioned')
      setTimeout(() => card.classList.remove('mentioned'), 1000)

      mentionActiveUntil = Date.now() + 5000
      document.getElementById('mention-text').textContent = data.words
      document.getElementById('mention-section').classList.add('visible')
      setTimeout(() => {
        if (Date.now() >= mentionActiveUntil) {
          document.getElementById('mention-section').classList.remove('visible')
        }
      }, 5000)
    })

    ipcRenderer.on('transcript', (_, data) => {
      document.getElementById('live-text').textContent = data.text
      if (Date.now() < mentionActiveUntil) {
        document.getElementById('mention-text').textContent = data.words
      }
    })

    ipcRenderer.on('summary', (_, data) => {
      document.getElementById('summary-text').textContent = data.text
    })

    ipcRenderer.on('question', (_, data) => {
      document.getElementById('transcript-text').textContent = `"${data.transcript}"`
      document.getElementById('answer-text').textContent = data.answer
      const followUpSection = document.getElementById('follow-up-section')
      if (data.follow_up) {
        document.getElementById('follow-up-text').textContent = data.follow_up
        followUpSection.style.display = 'block'
      } else {
        followUpSection.style.display = 'none'
      }
      document.getElementById('question-section').classList.add('visible')
    })

    ipcRenderer.on('dismiss', () => {
      document.getElementById('question-section').classList.remove('visible')
    })

    function dismiss() {
      document.getElementById('question-section').classList.remove('visible')
      ipcRenderer.send('dismiss')
    }
  </script>
</body>
</html>
