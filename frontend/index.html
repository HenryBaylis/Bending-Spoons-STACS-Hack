<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    /* ── Setup screen ── */
    #setup-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 15, 20, 0.97);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      flex-direction: column;
      padding: 28px 24px;
      -webkit-app-region: no-drag;
    }

    #setup-screen.visible { display: flex; }

    #setup-screen h1 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    #setup-screen .subtitle {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 5px;
    }

    .field input[type="text"] {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 7px;
      color: #fff;
      font-size: 13px;
      padding: 8px 10px;
      outline: none;
      -webkit-app-region: no-drag;
    }

    .field input[type="text"]:focus {
      border-color: rgba(255,255,255,0.3);
    }

    .file-drop {
      border: 1px dashed rgba(255,255,255,0.15);
      border-radius: 7px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
      -webkit-app-region: no-drag;
    }

    .file-drop:hover, .file-drop.dragover {
      border-color: rgba(255,255,255,0.35);
    }

    .file-drop p {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      margin-bottom: 4px;
    }

    .file-drop .file-name {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
    }

    .file-drop .file-hint {
      font-size: 10px;
      color: rgba(255,255,255,0.2);
    }

    #file-input { display: none; }

    .actions {
      margin-top: auto;
      padding-top: 20px;
    }

    #start-btn {
      width: 100%;
      background: #fff;
      color: #0f0f14;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      padding: 10px;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }

    #start-btn:hover { background: rgba(255,255,255,0.88); }
    #start-btn:disabled { background: rgba(255,255,255,0.2); color: rgba(0,0,0,0.3); cursor: not-allowed; }

    .hint {
      text-align: center;
      margin-top: 10px;
      font-size: 10px;
      color: rgba(255,255,255,0.2);
    }

    /* ── Overlay card ── */
    #card {
      display: none;
      background: rgba(15, 15, 20, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 14px 16px;
      width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      -webkit-app-region: drag;
    }

    #card.visible { display: block; }

    .label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 4px;
    }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    #live-section { margin-bottom: 10px; }

    #live-text {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      font-family: monospace;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
    }

    #summary-section { margin-bottom: 10px; }

    #summary-text {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      line-height: 1.4;
      font-style: italic;
    }

    #question-section {
      display: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 10px;
      animation: slideIn 0.2s ease;
    }

    #question-section.visible { display: block; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes ping {
      0%   { border-color: rgba(255, 255, 255, 0.1); }
      30%  { border-color: rgba(250, 204, 21, 0.7); }
      100% { border-color: rgba(255, 255, 255, 0.1); }
    }

    #card.mentioned { animation: ping 1s ease; }

    #transcript-text {
      font-size: 13px;
      color: rgba(255,255,255,0.65);
      margin-bottom: 10px;
      line-height: 1.4;
    }

    #answer-text {
      font-size: 14px;
      color: #fff;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    button.dismiss-btn {
      -webkit-app-region: no-drag;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 7px;
      color: rgba(255,255,255,0.6);
      font-size: 12px;
      padding: 5px 12px;
      cursor: pointer;
    }

    button.dismiss-btn:hover {
      background: rgba(255,255,255,0.14);
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Setup screen -->
  <div id="setup-screen">
    <h1>Meeting Monitor</h1>
    <p class="subtitle">Set up your profile before the meeting starts</p>

    <div class="field">
      <label>Your name <span style="color:rgba(255,100,100,0.7)">*</span></label>
      <input type="text" id="input-name" placeholder="e.g. Henry" />
    </div>

    <div class="field">
      <label>Job title <span style="color:rgba(255,100,100,0.7)">*</span></label>
      <input type="text" id="input-job" placeholder="e.g. Software Engineer" />
    </div>

    <div class="field">
      <label>Meeting context <span style="color:rgba(255,255,255,0.2)">(optional — PDF, TXT, or MD)</span></label>
      <div class="file-drop" id="file-drop" onclick="document.getElementById('file-input').click()">
        <p>Click to attach a file</p>
        <p class="file-name" id="file-name-display"></p>
        <p class="file-hint">PDF, TXT, or MD — will be used as context for answers</p>
      </div>
      <input type="file" id="file-input" accept=".pdf,.txt,.md" />
    </div>

    <div class="actions">
      <button id="start-btn" disabled>Start Meeting</button>
      <p class="hint">Press Ctrl+Shift+M to stop the meeting</p>
    </div>
  </div>

  <!-- Overlay card -->
  <div id="card">
    <div id="live-section">
      <div class="label"><span class="dot"></span>Live</div>
      <div id="live-text">—</div>
    </div>

    <div id="summary-section">
      <div class="label">Last summary</div>
      <div id="summary-text">—</div>
    </div>

    <div id="question-section">
      <div class="label">Someone's asking you</div>
      <div id="transcript-text"></div>
      <div class="label" style="margin-bottom:6px">Suggested response</div>
      <div id="answer-text"></div>
      <button class="dismiss-btn" onclick="dismiss()">Dismiss</button>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron')

    // ── Setup screen logic ──
    const nameInput = document.getElementById('input-name')
    const jobInput = document.getElementById('input-job')
    const startBtn = document.getElementById('start-btn')
    const fileInput = document.getElementById('file-input')
    const fileNameDisplay = document.getElementById('file-name-display')
    const fileDrop = document.getElementById('file-drop')

    let pendingFile = null

    function updateStartBtn() {
      startBtn.disabled = !nameInput.value.trim() || !jobInput.value.trim()
    }

    nameInput.addEventListener('input', updateStartBtn)
    jobInput.addEventListener('input', updateStartBtn)

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0]
      if (!file) return
      fileNameDisplay.textContent = file.name
      const reader = new FileReader()
      if (file.type === 'application/pdf') {
        reader.readAsArrayBuffer(file)
        reader.onload = () => {
          pendingFile = { name: file.name, type: file.type, data: Array.from(new Uint8Array(reader.result)) }
        }
      } else {
        reader.readAsText(file)
        reader.onload = () => {
          pendingFile = { name: file.name, type: file.type, data: reader.result }
        }
      }
    })

    // Drag and drop on file-drop zone
    fileDrop.addEventListener('dragover', (e) => { e.preventDefault(); fileDrop.classList.add('dragover') })
    fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('dragover'))
    fileDrop.addEventListener('drop', (e) => {
      e.preventDefault()
      fileDrop.classList.remove('dragover')
      const file = e.dataTransfer.files[0]
      if (file) {
        fileInput.files = e.dataTransfer.files
        fileInput.dispatchEvent(new Event('change'))
      }
    })

    startBtn.addEventListener('click', () => {
      ipcRenderer.send('start-meeting', {
        name: nameInput.value.trim(),
        jobTitle: jobInput.value.trim(),
        contextFile: pendingFile,
      })
    })

    // ── Screen switching ──
    ipcRenderer.on('show-setup', () => {
      document.getElementById('setup-screen').classList.add('visible')
      document.getElementById('card').classList.remove('visible')
      // Reset overlay state
      document.getElementById('question-section').classList.remove('visible')
      document.getElementById('live-text').textContent = '—'
      document.getElementById('summary-text').textContent = '—'
    })

    ipcRenderer.on('show-overlay', () => {
      document.getElementById('setup-screen').classList.remove('visible')
      document.getElementById('card').classList.add('visible')
    })

    // ── Overlay events ──
    ipcRenderer.on('mention', () => {
      const card = document.getElementById('card')
      card.classList.remove('mentioned')
      void card.offsetWidth
      card.classList.add('mentioned')
      setTimeout(() => card.classList.remove('mentioned'), 1000)
    })

    ipcRenderer.on('transcript', (_, data) => {
      document.getElementById('live-text').textContent = data.text
    })

    ipcRenderer.on('summary', (_, data) => {
      document.getElementById('summary-text').textContent = data.text
    })

    ipcRenderer.on('question', (_, data) => {
      document.getElementById('transcript-text').textContent = `"${data.transcript}"`
      document.getElementById('answer-text').textContent = data.answer
      document.getElementById('question-section').classList.add('visible')
    })

    ipcRenderer.on('dismiss', () => {
      document.getElementById('question-section').classList.remove('visible')
    })

    function dismiss() {
      document.getElementById('question-section').classList.remove('visible')
      ipcRenderer.send('dismiss')
    }
  </script>
</body>
</html>
